<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100">
  <defs>
    <linearGradient id="markBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4fbf"/>
      <stop offset="100%" stop-color="#091836"/>
    </linearGradient>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="60%" stop-color="#e8522a"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Emblem Mark (Left) -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="20" fill="url(#markBg)" filter="url(#subtleDrop)"/>
    <rect x="1.5" y="1.5" width="77" height="77" rx="18.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    
    <!-- Portal Ring 'O' -->
    <circle cx="45" cy="42" r="18" fill="none" stroke="url(#oGrad)" stroke-width="5.5"/>
    <circle cx="56" cy="29" r="2.8" fill="#facc15"/>
    
    <!-- Architectural 'Z' Structural Roof & Base -->
    <path d="M18 24 L52 24 L42 33 L18 33 Z" fill="url(#zGrad)"/>
    <path d="M42 33 L26 53 L34 53 L50 33 Z" fill="url(#zGrad)" opacity="0.92"/>
    <path d="M24 53 L62 53 L62 62 L24 62 Z" fill="url(#zGrad)"/>
    <!-- Apex Beacon -->
    <polygon points="35,14 40,21 30,21" fill="#facc15"/>
  </g>

  <!-- Wordmark Text (Right) -->
  <g transform="translate(108, 0)">
    <!-- Primary Name: ZAMEEN -->
    <text x="0" y="55" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="38" letter-spacing="-0.8" fill="#1d4fbf">ZAMEEN</text>
    <!-- Domain Tag: .ONLINE -->
    <text x="165" y="55" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.5" fill="#e8522a">.ONLINE</text>
    <!-- Tagline -->
    <text x="2" y="76" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="10.5" letter-spacing="2.2" fill="#64748b">AJK &amp; PAKISTAN PROPERTY PORTAL</text>
  </g>
</svg>
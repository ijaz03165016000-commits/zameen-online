<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4fbf"/>
      <stop offset="100%" stop-color="#0a1838"/>
    </linearGradient>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="60%" stop-color="#e8522a"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Distinct 'ZO' Architectural Mark -->
  <g filter="url(#glow)">
    <!-- 'O' Portal Ring (Warm Sunset) -->
    <circle cx="56" cy="52" r="23" fill="none" stroke="url(#oGrad)" stroke-width="7" opacity="0.95"/>
    <circle cx="70" cy="36" r="3.5" fill="#facc15"/>
    
    <!-- 'Z' Roof & Cantilever Structure (Crisp Clean White/Blue) -->
    <!-- Top Roofline -->
    <path d="M22 30 L66 30 L54 41 L22 41 Z" fill="url(#zGrad)"/>
    <!-- Diagonal Cantilever Cut -->
    <path d="M54 41 L34 65 L44 65 L64 41 Z" fill="url(#zGrad)" opacity="0.9"/>
    <!-- Bottom Foundation Beam -->
    <path d="M30 65 L76 65 L76 76 L30 76 Z" fill="url(#zGrad)"/>
    <!-- Central Rooftop Peak Accent -->
    <polygon points="44,18 50,26 38,26" fill="#facc15"/>
  </g>
</svg>
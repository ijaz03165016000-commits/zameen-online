<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard | Zameen Online</title>
  <meta name="theme-color" content="#1a3f8f">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
  <section class="page-hero">
    <div class="container"><h1 id="hello">My Dashboard</h1><p id="sub">Manage your ads, messages and profile</p></div>
  </section>
  <div class="container dash">
    <nav class="dash-nav" id="tabs">
      <button data-tab="ads" class="active">My Ads</button>
      <button data-tab="inbox">Messages <span class="count hidden" id="unread"></span></button>
      <button data-tab="favs">Saved</button>
      <button data-tab="profile">Profile</button>
      <button id="logout">Sign Out</button>
    </nav>
    <section id="panel"></section>
  </div>
</main>
<div id="site-footer"></div>
<script type="module" src="assets/js/pages/dashboard.js"></script>
</body>
</html>
